
# ─────────────────────────────────────────────
# Named volumes for persistent storage
# ─────────────────────────────────────────────
volumes:
  mysql_data:          # MySQL database files
  model_cache:         # Hugging Face model weights (avoids re-download)

# ─────────────────────────────────────────────
# Custom network — services talk by service name
# ─────────────────────────────────────────────
networks:
  careconnect_net:
    driver: bridge

secrets:
  firebase_service_account:
    file: ${FIREBASE_SERVICE_ACCOUNT_KEY:?Set FIREBASE_SERVICE_ACCOUNT_KEY to a local JSON file path}

# ─────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────
services:

  # ── 1. MySQL Database ───────────────────────
  mysql:
    image: mysql:8.0          # minimal official image
    container_name: careconnect_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set a database password in .env}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-careconnect}
    volumes:
      - mysql_data:/var/lib/mysql                          # persistent DB files
    networks:
      - careconnect_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Node.js Express API ──────────────────
  db-setup:
    build:
      context: ./4-system-engine/api
      dockerfile: Dockerfile
    command: ["node", "setup_db.js", "--migrate", "--confirm"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a database password in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-careconnect}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - careconnect_net

  api:
    build:
      context: ./4-system-engine/api
      dockerfile: Dockerfile
    container_name: careconnect_api
    restart: unless-stopped
    ports:
      - "3001:3001"            # expose to host for mobile apps
    environment:
      NODE_ENV:       production
      MYSQL_HOST:     mysql    # service-name DNS (not localhost!)
      MYSQL_PORT:     3306
      MYSQL_USER:     root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a database password in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-careconnect}
      FIREBASE_SERVICE_ACCOUNT_KEY: /run/secrets/firebase_service_account
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the deployed web origin(s)}
      DONUT_API_URL:  http://donut:8000   # internal networking
      DONUT_INTERNAL_TOKEN: ${DONUT_INTERNAL_TOKEN:?Set a private token for the internal prescription service}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      EXPO_PUSH_PROJECT_IDS: ${EXPO_PUSH_PROJECT_IDS:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      MEDICATION_ESCALATION_MINUTES: ${MEDICATION_ESCALATION_MINUTES:-30}
      NOTIFICATION_WORKER_INTERVAL_MS: ${NOTIFICATION_WORKER_INTERVAL_MS:-15000}
      MONITORING_RETENTION_DAYS: ${MONITORING_RETENTION_DAYS:-30}
    secrets:
      - firebase_service_account
    depends_on:
      mysql:
        condition: service_healthy      # wait for DB to be ready
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - careconnect_net

  # ── 3. Python Donut ML Service ──────────────
  donut:
    build:
      context: ./3-prescription-reader/server
      dockerfile: Dockerfile
    container_name: careconnect_donut
    restart: unless-stopped
    expose:
      - "8000"                # reachable only on the private service network
    volumes:
      - model_cache:/home/donut/.cache/huggingface   # reuse downloaded weights
      # Mount your fine-tuned model if stored locally:
      # - ./3-prescription-reader/best_model:/app/best_model:ro
    environment:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY:   ${GEMINI_API_KEY}
      DONUT_INTERNAL_TOKEN: ${DONUT_INTERNAL_TOKEN:?Set a private token for the internal prescription service}
    networks:
      - careconnect_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 4. Admin Web App Frontend ─────────────────
  frontend:
    build:
      context: .
      dockerfile: 1-ui-ux/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: careconnect_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - careconnect_net
